<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFlix - Catálogo de Juegos</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%) !important;
            background-attachment: fixed;
            color: #ffffff !important;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(90deg, #00f5d4, #f15bb5, #fee440);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .buscador {
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            width: 260px;
            outline: none;
            transition: all 0.3s;
        }

        .buscador:focus {
            border-color: #00f5d4;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
        }

        .buscador::placeholder {
            color: #aaa;
        }

        .hero {
            height: 65vh;
            display: flex;
            align-items: flex-end;
            padding: 60px 40px;
            position: relative;
            background: radial-gradient(circle at 30% 40%, rgba(241, 91, 181, 0.3), transparent 60%),
                        radial-gradient(circle at 70% 60%, rgba(0, 245, 212, 0.25), transparent 60%),
                        linear-gradient(135deg, #1a1a3e, #0f0c29);
            background-size: cover;
            background-position: center top;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, #0f0c29 0%, transparent 60%);
        }

        .hero-contenido {
            position: relative;
            z-index: 2;
            max-width: 650px;
            width: 100%;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #00f5d4, #f15bb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 22px;
            color: #ddd;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .hero-acciones {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .btn-hero {
            padding: 12px 32px;
            background: linear-gradient(90deg, #f15bb5, #9b5de5);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(241, 91, 181, 0.4);
        }

        .btn-hero:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(241, 91, 181, 0.6);
        }

        .contador-juegos {
            margin-left: auto;
            background: rgba(0, 245, 212, 0.15);
            color: #00f5d4;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid rgba(0, 245, 212, 0.4);
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
        }

        .filtros {
            padding: 20px 40px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: -30px;
            position: relative;
            z-index: 3;
        }

        .filtro-select {
            padding: 10px 20px;
            background: rgba(15, 12, 41, 0.85);
            color: #00f5d4;
            border: 1px solid rgba(0, 245, 212, 0.5);
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.2);
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f5d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
            padding-right: 45px;
        }

        .filtro-select:hover {
            border-color: #00f5d4;
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.4);
        }

        .filtro-select option {
            background: #1a1a3e;
            color: #fff;
        }

        .seccion-titulo {
            padding: 20px 40px;
            font-size: 26px;
            font-weight: 800;
            color: #fff;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 25px;
            padding: 20px 40px 80px;
        }

        .tarjeta {
            background: #1a1a3e;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            aspect-ratio: 3 / 5; 
            margin-top: 15px; 
        }

        .tarjeta:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 40px rgba(241, 91, 181, 0.3), 0 0 30px rgba(0, 245, 212, 0.2);
        }

        .tarjeta-imagen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .tarjeta-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: transform 0.5s;
            display: block;
        }

        .tarjeta:hover .tarjeta-imagen img {
            transform: scale(1.08);
        }

        .tarjeta-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 2;
            padding: 80px 16px 16px 16px;
            background: linear-gradient(to top, rgba(15, 12, 41, 0.98) 0%, rgba(15, 12, 41, 0.8) 50%, transparent 100%);
            display: flex;
            flex-direction: column;
        }

        .tarjeta-info h3 {
            font-size: 16px;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .tarjeta-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .tarjeta-generos {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .genero-tag {
            font-size: 10px;
            padding: 3px 9px;
            background: rgba(0, 245, 212, 0.2);
            color: #00f5d4;
            border-radius: 10px;
            border: 1px solid rgba(0, 245, 212, 0.4);
            backdrop-filter: blur(4px);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.activo {
            display: flex;
        }

        .modal-contenido {
            background: linear-gradient(135deg, #1a1a3e, #24243e);
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            position: relative;
            border: 1px solid rgba(0, 245, 212, 0.3);
            box-shadow: 0 0 60px rgba(0, 245, 212, 0.2);
            max-height: 90vh;
            overflow-y: auto;
            
            /* NUEVO: Para evitar el parpadeo */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .modal-imagen {
            width: 100%;
            height: 320px; 
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            padding: 10px;
        }

        .modal-imagen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cerrar {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 32px;
            cursor: pointer;
            color: #aaa;
            transition: color 0.3s;
            z-index: 10;
        }

        .cerrar:hover {
            color: #f15bb5;
        }

        .modal-contenido h2 {
            background: linear-gradient(90deg, #00f5d4, #f15bb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .modal-contenido p {
            line-height: 1.7;
            margin-bottom: 12px;
            color: #ddd;
        }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; }
            .logo { font-size: 20px; }
            .buscador { width: 140px; }
            .hero { padding: 40px 20px; height: 55vh; }
            .hero h1 { font-size: 34px; }
            .filtros, .seccion-titulo, .catalogo { padding-left: 20px; padding-right: 20px; }
            .catalogo { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
            .tarjeta { margin-top: 10px; }
            .tarjeta-info { padding: 60px 12px 12px 12px; }
            .modal-contenido { padding: 25px; }
            .modal-imagen { height: 250px; }
            .contador-juegos { font-size: 13px; padding: 8px 15px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">🎮 GAMEFLIX</div>
        <input type="text" id="buscador" placeholder="Buscar juego..." class="buscador">
    </header>

    <section class="hero" id="hero">
        <div class="hero-contenido">
            <h1 id="hero-titulo">Cargando...</h1>
            <p id="hero-sinopsis"></p>
            
            <div class="hero-acciones">
                <button class="btn-hero" onclick="scrollToCatalogo()">Ver catálogo</button>
                <div class="contador-juegos" id="contador-juegos">0 Juegos</div>
            </div>

        </div>
    </section>

    <section class="filtros" id="filtros">
        <select class="filtro-select" id="select-genero">
            <option value="todos">Todos los géneros</option>
        </select>
    </section>

    <main>
        <h2 class="seccion-titulo">Catálogo completo</h2>
        <div class="catalogo" id="catalogo"></div>
    </main>

    <div class="modal" id="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarModal()">&times;</span>
            <div class="modal-imagen" id="modal-imagen"></div>
            <h2 id="modal-titulo"></h2>
            <p id="modal-info"></p>
            <p id="modal-sinopsis"></p>
        </div>
    </div>

    <script>
        const URL_DATOS = './lista.txt';
        let todosLosJuegos = [];

        async function cargarDatos() {
            try {
                const respuesta = await fetch(URL_DATOS);
                todosLosJuegos = await respuesta.json();

                mostrarHero(todosLosJuegos[Math.floor(Math.random() * todosLosJuegos.length)]);
                generarFiltros(todosLosJuegos);
                renderizarCatalogo(todosLosJuegos);
                
                document.getElementById('contador-juegos').textContent = `${todosLosJuegos.length} Juegos`;

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('catalogo').innerHTML = '<p style="padding: 20px;">Error al cargar el catálogo. Revisa que lista.txt sea un JSON válido y no esté cortado.</p>';
            }
        }

        function mostrarHero(juego) {
            document.getElementById('hero-titulo').textContent = juego.titulo;
            document.getElementById('hero-sinopsis').textContent = juego.sinopsis;

            const hero = document.getElementById('hero');
            const aplicarFondo = (url) => {
                hero.style.backgroundImage = `linear-gradient(0deg, #0f0c29 0%, rgba(15,12,41,0.6) 50%, transparent 100%), url('${url}')`;
            };
            const fondoPorDefecto = () => {
                hero.style.backgroundImage = `linear-gradient(135deg, #1a1a3e, #0f0c29)`;
            };

            const urlsFanartLocal = [
                `images/fanart/${juego.id}.jpg`,
                `images/fanart/${juego.id}.png`,
                `images/fanart/${juego.id}.avif`
            ];
            const urlWeb      = `https://art.gametdb.com/switch/coverfullHQ/${juego.region}/${juego.id}.jpg`;
            const urlBoxLocal = `images/box/${juego.id}.png`;

            let index = 0;
            const intentar = () => {
                if (index < urlsFanartLocal.length) {
                    const img = new Image();
                    img.onload = () => aplicarFondo(urlsFanartLocal[index]);
                    img.onerror = () => { index++; intentar(); };
                    img.src = urlsFanartLocal[index];
                } else {
                    const imgWeb = new Image();
                    imgWeb.onload = () => aplicarFondo(urlWeb);
                    imgWeb.onerror = () => {
                        const imgBox = new Image();
                        imgBox.onload = () => aplicarFondo(urlBoxLocal);
                        imgBox.onerror = fondoPorDefecto;
                        imgBox.src = urlBoxLocal;
                    };
                    imgWeb.src = urlWeb;
                }
            };
            intentar();
        }

        function generarFiltros(juegos) {
            const select = document.getElementById('select-genero');
            const generosSet = new Set();

            juegos.forEach(j => {
                (j.genero || []).forEach(g => generosSet.add(g));
            });

            const generos = Array.from(generosSet).sort();

            generos.forEach(genero => {
                const option = document.createElement('option');
                option.value = genero;
                option.textContent = genero;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                const genero = e.target.value;
                if (genero === 'todos') {
                    renderizarCatalogo(todosLosJuegos);
                } else {
                    const filtrados = todosLosJuegos.filter(j =>
                        (j.genero || []).some(g => g.toLowerCase() === genero.toLowerCase())
                    );
                    renderizarCatalogo(filtrados);
                }
            });
        }

        function renderizarCatalogo(juegos) {
            const catalogo = document.getElementById('catalogo');
            catalogo.innerHTML = '';

            juegos.forEach(juego => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                tarjeta.onclick = () => abrirModal(juego);

                const urlsBoxLocal = [
                    `images/box/${juego.id}.jpg`,
                    `images/box/${juego.id}.png`,
                    `images/box/${juego.id}.avif`
                ];
                const urlWeb = `https://art.gametdb.com/switch/box/${juego.region}/${juego.id}.png`;

                tarjeta.innerHTML = `
                    <div class="tarjeta-imagen">
                        <img src="${urlsBoxLocal[0]}" alt="${juego.titulo}" loading="lazy"
                             data-index="0"
                             data-local="${urlsBoxLocal.join('|')}"
                             data-web="${urlWeb}"
                             onerror="
                                let idx = parseInt(this.dataset.index);
                                let locs = this.dataset.local.split('|');
                                if (idx < locs.length - 1) {
                                    this.dataset.index = idx + 1;
                                    this.src = locs[idx + 1];
                                } else if (!this.dataset.intentoWeb) {
                                    this.dataset.intentoWeb = '1';
                                    this.src = this.dataset.web;
                                } else {
                                    this.style.display='none';
                                    this.parentElement.innerHTML='🎮';
                                }
                             ">
                    </div>
                    <div class="tarjeta-info">
                        <h3>${juego.titulo}</h3>
                        <div class="tarjeta-meta">
                            <span>${juego.lanzamiento || 'N/A'}</span>
                            <span>${juego.region || ''}</span>
                        </div>
                        <div class="tarjeta-generos">
                            ${(juego.genero || []).map(g => `<span class="genero-tag">${g}</span>`).join('')}
                        </div>
                    </div>
                `;
                catalogo.appendChild(tarjeta);
            });
        }

        function abrirModal(juego) {
            const modalImg = document.getElementById('modal-imagen');
            const modalContenido = document.querySelector('.modal-contenido');
            
            modalContenido.style.opacity = '0';
            document.getElementById('modal').classList.add('activo');

            const urlsFanartLocal = [
                `images/fanart/${juego.id}.jpg`,
                `images/fanart/${juego.id}.png`,
                `images/fanart/${juego.id}.avif`
            ];
            const urlWeb      = `https://art.gametdb.com/switch/coverfullHQ/${juego.region}/${juego.id}.jpg`;
            const urlBoxLocal = `images/box/${juego.id}.png`;

            modalImg.innerHTML = '';

            const img = document.createElement('img');
            img.alt = juego.titulo;

            let intentoLocalIndex = 0;

            const mostrarContenido = () => {
                setTimeout(() => {
                    modalContenido.style.opacity = '1';
                }, 50);
            };

            img.onload = () => {
                mostrarContenido();
            };

            img.onerror = () => {
                if (intentoLocalIndex < urlsFanartLocal.length) {
                    img.src = urlsFanartLocal[intentoLocalIndex];
                    intentoLocalIndex++;
                } else if (img.dataset.paso !== 'web') {
                    img.dataset.paso = 'web';
                    img.src = urlWeb;
                } else if (img.dataset.paso !== 'box') {
                    img.dataset.paso = 'box';
                    img.src = urlBoxLocal;
                } else {
                    modalImg.innerHTML = '🎮';
                    mostrarContenido();
                }
            };

            img.src = urlsFanartLocal[0];
            intentoLocalIndex = 1;

            modalImg.appendChild(img);

            document.getElementById('modal-titulo').textContent = juego.titulo;
            document.getElementById('modal-info').innerHTML =
                `<strong>Plataforma:</strong> ${juego.plataforma || 'N/A'}<br>
                 <strong>Año:</strong> ${juego.lanzamiento || 'N/A'}<br>
                 <strong>Géneros:</strong> ${(juego.genero || []).join(', ')}<br>
                 <strong>Región:</strong> ${juego.region || 'N/A'}<br>
                 <strong>Estado:</strong> ${juego.estado || 'N/A'}`;
            document.getElementById('modal-sinopsis').textContent = juego.sinopsis;
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('activo');
        }

        function scrollToCatalogo() {
            document.querySelector('.seccion-titulo').scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = todosLosJuegos.filter(j =>
                j.titulo.toLowerCase().includes(texto) ||
                (j.sinopsis && j.sinopsis.toLowerCase().includes(texto))
            );
            renderizarCatalogo(filtrados);
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') cerrarModal();
        });

        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
